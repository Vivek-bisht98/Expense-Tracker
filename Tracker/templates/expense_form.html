<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#2563eb,#7c3aed);

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

        }

        .container{

            width:90%;
            max-width:650px;

        }

        .card{

            background:white;

            padding:35px;

            border-radius:15px;

            box-shadow:0 12px 25px rgba(0,0,0,.2);

        }

        h1{

            text-align:center;

            color:#2563eb;

            margin-bottom:30px;

        }

        label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#444;

        }

        input,
        select,
        textarea{

            width:100%;

            padding:12px;

            margin-bottom:20px;

            border:1px solid #ccc;

            border-radius:8px;

            font-size:16px;

            transition:.3s;

        }

        input:focus,
        select:focus,
        textarea:focus{

            border-color:#2563eb;

            outline:none;

            box-shadow:0 0 6px rgba(37,99,235,.3);

        }

        textarea{

            resize:vertical;

            min-height:120px;

        }

        .buttons{

            display:flex;

            justify-content:space-between;

            gap:15px;

        }

        .btn{

            flex:1;

            text-decoration:none;

            border:none;

            text-align:center;

            padding:13px;

            border-radius:8px;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            color:white;

            transition:.3s;

        }

        .home{

            background:#2563eb;

        }

        .submit{

            background:#16a34a;

        }

        .btn:hover{

            opacity:.85;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>💰 Add New Expense</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Expense Name</label>

            <input
                type="text"
                name="expense_name"
                placeholder="Enter Expense Name"
                required
            >

            <label>Amount</label>

            <input
                type="number"
                name="amount"
                placeholder="Enter Amount"
                required
            >

            <label>Category</label>

            <select name="category">

                <option value="food">Food</option>

                <option value="transportation">Transportation</option>

                <option value="entertainment">Entertainment</option>

                <option value="rent">Rent</option>

                <option value="other">Other</option>

            </select>

            <label>Payment Method</label>

            <select name="payment">

                <option value="UPI">UPI</option>

                <option value="CASH">Cash</option>

            </select>

            <label>Date</label>

            <input
                type="date"
                name="date"
                required
            >

            <label>Description</label>

            <textarea
                name="description"
                placeholder="Write something about this expense..."
            ></textarea>

            <div class="buttons">

                <a href="{% url 'home' %}" class="btn home">
                    Home
                </a>

                <button
                    type="submit"
                    class="btn submit"
                >
                    Add Expense
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
