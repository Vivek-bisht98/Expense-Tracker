<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#2563eb,#7c3aed);

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

        }

        .container{

            width:90%;
            max-width:420px;

        }

        .card{

            background:white;

            padding:35px;

            border-radius:15px;

            box-shadow:0 12px 25px rgba(0,0,0,.25);

        }

        h2{

            text-align:center;

            color:#2563eb;

            margin-bottom:30px;

        }

        label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#444;

        }

        input{

            width:100%;

            padding:12px;

            margin-bottom:20px;

            border:1px solid #ccc;

            border-radius:8px;

            font-size:16px;

            transition:.3s;

        }

        input:focus{

            border-color:#2563eb;

            outline:none;

            box-shadow:0 0 6px rgba(37,99,235,.3);

        }

        .btn{

            width:100%;

            border:none;

            background:#2563eb;

            color:white;

            padding:13px;

            border-radius:8px;

            font-size:16px;

            cursor:pointer;

            font-weight:bold;

            transition:.3s;

        }

        .btn:hover{

            background:#1d4ed8;

        }

        .error{

            background:#fee2e2;

            color:#dc2626;

            padding:12px;

            border-radius:8px;

            text-align:center;

            margin-bottom:15px;

        }

        .register{

            margin-top:20px;

            text-align:center;

            color:#666;

        }

        .register a{

            text-decoration:none;

            color:#2563eb;

            font-weight:bold;

        }

        .register a:hover{

            text-decoration:underline;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>🔐 Login</h2>

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}

            <button
                type="submit"
                class="btn"
            >
                Login
            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="{% url 'register_user' %}">
                Register
            </a>

        </div>

    </div>

</div>

</body>
</html>
